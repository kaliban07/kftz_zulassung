name: KFZ Termin Checker Köln

on:
  repository_dispatch:
    types: [trigger-check]
  workflow_dispatch:

# verhindert, dass sich Läufe stapeln
concurrency:
  group: kfz-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Checker ausführen
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python checker.py

      # Screenshots + HTML jedes Schritts – zum Nachsehen, was der Bot wirklich sieht
      - name: Debug-Dateien hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          retention-days: 3
